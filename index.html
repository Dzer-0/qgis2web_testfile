    <body>
        <div id="map">
        </div>
        <script src="js/qgis2web_expressions.js"></script>
        <script src="js/leaflet.js"></script>
        <script src="js/L.Control.Layers.Tree.min.js"></script>
        <script src="js/L.Control.Locate.min.js"></script>
        <script src="js/leaflet.rotatedMarker.js"></script>
        <script src="js/leaflet.pattern.js"></script>
        <script src="js/leaflet-hash.js"></script>

        <script src="js/rbush.min.js"></script>
        <script src="js/labelgun.min.js"></script>

        <script src="data/gambut_dummy2_1.js"></script>
        <script src="data/IUP2_2.js"></script>
        <script>
        var highlightLayer;
        function highlightFeature(e) {
            highlightLayer = e.target;

            if (e.target.feature.geometry.type === 'LineString' || e.target.feature.geometry.type === 'MultiLineString') {
              highlightLayer.setStyle({
                color: 'rgba(255, 255, 0, 1.00)',
              });
            } else {
              highlightLayer.setStyle({
                fillColor: 'rgba(255, 255, 0, 1.00)',
                fillOpacity: 1
              });
            }
            highlightLayer.openPopup();
        }
        var map = L.map('map', {
            zoomControl:false, maxZoom:28, minZoom:1
        }).fitBounds([[-1.700559006748653,109.86361668607151],[-1.1028470327923157,110.83411218062693]]);
        var hash = new L.Hash(map);
        map.attributionControl.setPrefix('<a href="https://github.com/tomchadwin/qgis2web" target="_blank">qgis2web</a> &middot; <a href="https://leafletjs.com" title="A JS library for interactive maps">Leaflet</a> &middot; <a href="https://qgis.org">QGIS</a>');
        var autolinker = new Autolinker({truncate: {length: 30, location: 'smart'}});
        // remove popup's row if "visible-with-data"
        function removeEmptyRowsFromPopupContent(content, feature) {
         var tempDiv = document.createElement('div');
         tempDiv.innerHTML = content;
         var rows = tempDiv.querySelectorAll('tr');
         for (var i = 0; i < rows.length; i++) {
             var td = rows[i].querySelector('td.visible-with-data');
             var key = td ? td.id : '';
             if (td && td.classList.contains('visible-with-data') && feature.properties[key] == null) {
                 rows[i].parentNode.removeChild(rows[i]);
             }
         }
         return tempDiv.innerHTML;
        }
        // modify popup if contains media
        function addClassToPopupIfMedia(content, popup) {
            var tempDiv = document.createElement('div');
            tempDiv.innerHTML = content;
            var imgTd = tempDiv.querySelector('td img');
            if (imgTd) {
                var src = imgTd.getAttribute('src');
                if (/\.(jpg|jpeg|png|gif|bmp|webp|avif)$/i.test(src)) {
                    popup._contentNode.classList.add('media');
                    setTimeout(function() {
                        popup.update();
                    }, 10);
                } else if (/\.(mp3|wav|ogg|aac)$/i.test(src)) {
                    var audio = document.createElement('audio');
                    audio.controls = true;
                    audio.src = src;
                    imgTd.parentNode.replaceChild(audio, imgTd);
                    popup._contentNode.classList.add('media');
                    setTimeout(function() {
                        popup.setContent(tempDiv.innerHTML);
                        popup.update();
                    }, 10);
                } else if (/\.(mp4|webm|ogg|mov)$/i.test(src)) {
                    var video = document.createElement('video');
                    video.controls = true;
                    video.src = src;
                    video.style.width = "400px";
                    video.style.height = "300px";
                    video.style.maxHeight = "60vh";
                    video.style.maxWidth = "60vw";
                    imgTd.parentNode.replaceChild(video, imgTd);
                    popup._contentNode.classList.add('media');
                    // Aggiorna il popup quando il video carica i metadati
                    video.addEventListener('loadedmetadata', function() {
                        popup.update();
                    });
                    setTimeout(function() {
                        popup.setContent(tempDiv.innerHTML);
                        popup.update();
                    }, 10);
                } else {
                    popup._contentNode.classList.remove('media');
                }
            } else {
                popup._contentNode.classList.remove('media');
            }
        }
        var zoomControl = L.control.zoom({
            position: 'topleft'
        }).addTo(map);
        L.control.locate({locateOptions: {maxZoom: 19}}).addTo(map);
        var measureControl = new L.Control.Measure({
            position: 'topleft',
            primaryLengthUnit: 'meters',
            secondaryLengthUnit: 'kilometers',
            primaryAreaUnit: 'sqmeters',
            secondaryAreaUnit: 'hectares'
        });
        measureControl.addTo(map);
        document.getElementsByClassName('leaflet-control-measure-toggle')[0].innerHTML = '';
        document.getElementsByClassName('leaflet-control-measure-toggle')[0].className += ' fas fa-ruler';
        var bounds_group = new L.featureGroup([]);
        function setBounds() {
        }
        map.createPane('pane_BasemapGoogle_Z17_260109_0');
        map.getPane('pane_BasemapGoogle_Z17_260109_0').style.zIndex = 400;
        var img_BasemapGoogle_Z17_260109_0 = 'data/BasemapGoogle_Z17_260109_0.png';
        var img_bounds_BasemapGoogle_Z17_260109_0 = [[-1.6366195678710938,109.87117767333984],[-1.2699508666992188,110.43697357177734]];
        var layer_BasemapGoogle_Z17_260109_0 = new L.imageOverlay(img_BasemapGoogle_Z17_260109_0,
                                              img_bounds_BasemapGoogle_Z17_260109_0,
                                              {pane: 'pane_BasemapGoogle_Z17_260109_0'});
        bounds_group.addLayer(layer_BasemapGoogle_Z17_260109_0);
        map.addLayer(layer_BasemapGoogle_Z17_260109_0);
        function pop_gambut_dummy2_1(feature, layer) {
            layer.on({
                mouseout: function(e) {
                    for (var i in e.target._eventParents) {
                        if (typeof e.target._eventParents[i].resetStyle === 'function') {
                            e.target._eventParents[i].resetStyle(e.target);
                        }
                    }
                    if (typeof layer.closePopup == 'function') {
                        layer.closePopup();
                    } else {
                        layer.eachLayer(function(feature){
                            feature.closePopup()
                        });
                    }
                },
                mouseover: highlightFeature,
            });
            var popupContent = '<table>\
                    <tr>\
                        <td colspan="2"><strong>FEG_KGHLTR</strong><br />' + (feature.properties['FEG_KGHLTR'] !== null ? autolinker.link(String(feature.properties['FEG_KGHLTR']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <td colspan="2">' + (feature.properties['L'] !== null ? autolinker.link(String(feature.properties['L']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                </table>';
            var content = removeEmptyRowsFromPopupContent(popupContent, feature);
			layer.on('popupopen', function(e) {
				addClassToPopupIfMedia(content, e.popup);
			});
			layer.bindPopup(content, { maxHeight: 400 });
        }

        function style_gambut_dummy2_1_0(feature) {
            switch(String(feature.properties['FEG_KGHLTR'])) {
                case 'Indikatif Fungsi Budidaya E.G.':
                    return {
                pane: 'pane_gambut_dummy2_1',
                opacity: 1,
                color: 'rgba(53,121,177,1.0)',
                dashArray: '',
                lineCap: 'square',
                lineJoin: 'bevel',
                weight: 4.0,
                fillOpacity: 0,
                interactive: true,
            }
                    break;
                case 'Indikatif Fungsi Lindung E.G.':
                    return {
                pane: 'pane_gambut_dummy2_1',
                opacity: 1,
                color: 'rgba(0,255,27,1.0)',
                dashArray: '',
                lineCap: 'butt',
                lineJoin: 'miter',
                weight: 1.0, 
                fill: true,
                fillOpacity: 1,
                fillColor: 'rgba(38,255,0,1.0)',
                interactive: true,
            }
                    break;
            }
        }
        map.createPane('pane_gambut_dummy2_1');
        map.getPane('pane_gambut_dummy2_1').style.zIndex = 401;
        map.getPane('pane_gambut_dummy2_1').style['mix-blend-mode'] = 'normal';
        var layer_gambut_dummy2_1 = new L.geoJson(json_gambut_dummy2_1, {
            attribution: '',
            interactive: true,
            dataVar: 'json_gambut_dummy2_1',
            layerName: 'layer_gambut_dummy2_1',
            pane: 'pane_gambut_dummy2_1',
            onEachFeature: pop_gambut_dummy2_1,
            style: style_gambut_dummy2_1_0,
        });
        bounds_group.addLayer(layer_gambut_dummy2_1);
        map.addLayer(layer_gambut_dummy2_1);
        function pop_IUP2_2(feature, layer) {
            layer.on({
                mouseout: function(e) {
                    for (var i in e.target._eventParents) {
                        if (typeof e.target._eventParents[i].resetStyle === 'function') {
                            e.target._eventParents[i].resetStyle(e.target);
                        }
                    }
                    if (typeof layer.closePopup == 'function') {
                        layer.closePopup();
                    } else {
                        layer.eachLayer(function(feature){
                            feature.closePopup()
                        });
                    }
                },
                mouseover: highlightFeature,
            });
            var popupContent = '<table>\
                    <tr>\
                        <td colspan="2">' + (feature.properties['L'] !== null ? autolinker.link(String(feature.properties['L']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <td colspan="2">' + (feature.properties['No_SK'] !== null ? autolinker.link(String(feature.properties['No_SK']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                </table>';
            var content = removeEmptyRowsFromPopupContent(popupContent, feature);
			layer.on('popupopen', function(e) {
				addClassToPopupIfMedia(content, e.popup);
			});
			layer.bindPopup(content, { maxHeight: 400 });
        }

        function style_IUP2_2_0() {
            return {
                pane: 'pane_IUP2_2',
                opacity: 1,
                color: 'rgba(228,26,28,1.0)',
                dashArray: '',
                lineCap: 'square',
                lineJoin: 'bevel',
                weight: 4.0,
                fillOpacity: 0,
                interactive: true,
            }
        }
        map.createPane('pane_IUP2_2');
        map.getPane('pane_IUP2_2').style.zIndex = 402;
        map.getPane('pane_IUP2_2').style['mix-blend-mode'] = 'normal';
        var layer_IUP2_2 = new L.geoJson(json_IUP2_2, {
            attribution: '',
            interactive: true,
            dataVar: 'json_IUP2_2',
            layerName: 'layer_IUP2_2',
            pane: 'pane_IUP2_2',
            onEachFeature: pop_IUP2_2,
            style: style_IUP2_2_0,
        });
        bounds_group.addLayer(layer_IUP2_2);
        map.addLayer(layer_IUP2_2);
        setBounds();
        var i = 0;
        layer_IUP2_2.eachLayer(function(layer) {
            var context = {
                feature: layer.feature,
                variables: {}
            };
            layer.bindTooltip((exp_label_IUP2_2_eval_expression(context) !== null?String('<div style="color: #323232; font-size: 10pt; font-family: \'Open Sans\', sans-serif;">' + exp_label_IUP2_2_eval_expression(context)) + '</div>':''), {permanent: true, offset: [-0, -16], className: 'css_IUP2_2'});
            labels.push(layer);
            totalMarkers += 1;
              layer.added = true;
              addLabel(layer, i);
              i++;
        });
        L.ImageOverlay.include({
            getBounds: function () {
                return this._bounds;
            }
        });
        resetLabels([layer_IUP2_2]);
        map.on("zoomend", function(){
            resetLabels([layer_IUP2_2]);
        });
        map.on("layeradd", function(){
            resetLabels([layer_IUP2_2]);
        });
        map.on("layerremove", function(){
            resetLabels([layer_IUP2_2]);
        });
        </script>
