<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="initial-scale=1,user-scalable=no,maximum-scale=1,width=device-width">
        <meta name="mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-capable" content="yes">
        <link rel="stylesheet" href="css/leaflet.css">
        <link rel="stylesheet" href="css/L.Control.Layers.Tree.css">
        <link rel="stylesheet" href="css/qgis2web.css">
        <link rel="stylesheet" href="css/fontawesome-all.min.css">
        <link rel="stylesheet" href="css/leaflet.photon.css">
        <style>
        html, body, #map {
            width: 100%;
            height: 100%;
            padding: 0;
            margin: 0;
        }
        </style>
        <title>qgis2web test map</title>
    </head>
    <body>
        <div id="map">
        </div>
        <script src="js/qgis2web_expressions.js"></script>
        <script src="js/leaflet.js"></script>
        <script src="js/L.Control.Layers.Tree.min.js"></script>
        <script src="js/multi-style-layer.js"></script>
        <script src="js/leaflet.rotatedMarker.js"></script>
        <script src="js/leaflet.pattern.js"></script>
        <script src="js/leaflet-hash.js"></script>
        <script src="js/Autolinker.min.js"></script>
        <script src="js/rbush.min.js"></script>
        <script src="js/labelgun.min.js"></script>
        <script src="js/labels.js"></script>
        <script src="js/leaflet.photon.js"></script>
        <script src="data/Plan_Bebas_0.js"></script>
        <script src="data/IUP_1.js"></script>
        <script>
        var map = L.map('map', {
            zoomControl:false, maxZoom:28, minZoom:1
        }).fitBounds([[-1.5030110845381064,110.08537662631404],[-1.3488138553965425,110.33574423257811]]);
        var hash = new L.Hash(map);
        map.attributionControl.setPrefix('<a href="https://github.com/tomchadwin/qgis2web" target="_blank">qgis2web</a> &middot; <a href="https://leafletjs.com" title="A JS library for interactive maps">Leaflet</a> &middot; <a href="https://qgis.org">QGIS</a>');
        var autolinker = new Autolinker({truncate: {length: 30, location: 'smart'}});
        // remove popup's row if "visible-with-data"
        function removeEmptyRowsFromPopupContent(content, feature) {
         var tempDiv = document.createElement('div');
         tempDiv.innerHTML = content;
         var rows = tempDiv.querySelectorAll('tr');
         for (var i = 0; i < rows.length; i++) {
             var td = rows[i].querySelector('td.visible-with-data');
             var key = td ? td.id : '';
             if (td && td.classList.contains('visible-with-data') && feature.properties[key] == null) {
                 rows[i].parentNode.removeChild(rows[i]);
             }
         }
         return tempDiv.innerHTML;
        }
        // modify popup if contains media
        function addClassToPopupIfMedia(content, popup) {
            var tempDiv = document.createElement('div');
            tempDiv.innerHTML = content;
            var imgTd = tempDiv.querySelector('td img');
            if (imgTd) {
                var src = imgTd.getAttribute('src');
                if (/\.(jpg|jpeg|png|gif|bmp|webp|avif)$/i.test(src)) {
                    popup._contentNode.classList.add('media');
                    setTimeout(function() {
                        popup.update();
                    }, 10);
                } else if (/\.(mp3|wav|ogg|aac)$/i.test(src)) {
                    var audio = document.createElement('audio');
                    audio.controls = true;
                    audio.src = src;
                    imgTd.parentNode.replaceChild(audio, imgTd);
                    popup._contentNode.classList.add('media');
                    setTimeout(function() {
                        popup.setContent(tempDiv.innerHTML);
                        popup.update();
                    }, 10);
                } else if (/\.(mp4|webm|ogg|mov)$/i.test(src)) {
                    var video = document.createElement('video');
                    video.controls = true;
                    video.src = src;
                    video.style.width = "400px";
                    video.style.height = "300px";
                    video.style.maxHeight = "60vh";
                    video.style.maxWidth = "60vw";
                    imgTd.parentNode.replaceChild(video, imgTd);
                    popup._contentNode.classList.add('media');
                    // Aggiorna il popup quando il video carica i metadati
                    video.addEventListener('loadedmetadata', function() {
                        popup.update();
                    });
                    setTimeout(function() {
                        popup.setContent(tempDiv.innerHTML);
                        popup.update();
                    }, 10);
                } else {
                    popup._contentNode.classList.remove('media');
                }
            } else {
                popup._contentNode.classList.remove('media');
            }
        }
        var zoomControl = L.control.zoom({
            position: 'topleft'
        }).addTo(map);
        var bounds_group = new L.featureGroup([]);
        function setBounds() {
        }
        function pop_Plan_Bebas_0(feature, layer) {
            var popupContent = '<table>\
                    <tr>\
                        <td colspan="2">' + (feature.properties['Id'] !== null ? autolinker.link(String(feature.properties['Id']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <td colspan="2">' + (feature.properties['Pemilik'] !== null ? autolinker.link(String(feature.properties['Pemilik']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <td colspan="2">' + (feature.properties['Luas'] !== null ? autolinker.link(String(feature.properties['Luas']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <td colspan="2">' + (feature.properties['Jenis_Sura'] !== null ? autolinker.link(String(feature.properties['Jenis_Sura']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <td colspan="2">' + (feature.properties['Luas_SKT'] !== null ? autolinker.link(String(feature.properties['Luas_SKT']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <td colspan="2">' + (feature.properties['Keterangan'] !== null ? autolinker.link(String(feature.properties['Keterangan']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <td colspan="2">' + (feature.properties['Penawaran'] !== null ? autolinker.link(String(feature.properties['Penawaran']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                </table>';
            var content = removeEmptyRowsFromPopupContent(popupContent, feature);
			layer.on('popupopen', function(e) {
				addClassToPopupIfMedia(content, e.popup);
			});
			layer.bindPopup(content, { maxHeight: 400 });
        }

        var pattern_Plan_Bebas_0_0 = new L.StripePattern({
            weight: 0.3,
            spaceWeight: 2.0,
            color: '#e400ff',
            opacity: 1.0,
            spaceOpacity: 0,
            angle: 315
        });
        pattern_Plan_Bebas_0_0.addTo(map);
        function style_Plan_Bebas_0_0() {
            return {
                pane: 'pane_Plan_Bebas_0',
                stroke: false,
                fillOpacity: 1,
                fillPattern: pattern_Plan_Bebas_0_0,
                interactive: true,
            }
        }
        var pattern_Plan_Bebas_0_1 = new L.StripePattern({
            weight: 0.3,
            spaceWeight: 2.0,
            color: '#ec00ff',
            opacity: 1.0,
            spaceOpacity: 0,
            angle: 225
        });
        pattern_Plan_Bebas_0_1.addTo(map);
        function style_Plan_Bebas_0_1() {
            return {
                pane: 'pane_Plan_Bebas_0',
                stroke: false,
                fillOpacity: 1,
                fillPattern: pattern_Plan_Bebas_0_1,
                interactive: true,
            }
        }
        function style_Plan_Bebas_0_2() {
            return {
                pane: 'pane_Plan_Bebas_0',
                opacity: 1,
                color: 'rgba(48,241,1,1.0)',
                dashArray: '',
                lineCap: 'square',
                lineJoin: 'bevel',
                weight: 2.0,
                fillOpacity: 0,
                interactive: true,
            }
        }
        map.createPane('pane_Plan_Bebas_0');
        map.getPane('pane_Plan_Bebas_0').style.zIndex = 400;
        map.getPane('pane_Plan_Bebas_0').style['mix-blend-mode'] = 'normal';
        var layer_Plan_Bebas_0 = new L.geoJson.multiStyle(json_Plan_Bebas_0, {
            attribution: '',
            interactive: true,
            dataVar: 'json_Plan_Bebas_0',
            layerName: 'layer_Plan_Bebas_0',
            pane: 'pane_Plan_Bebas_0',
            onEachFeature: pop_Plan_Bebas_0,
            styles: [style_Plan_Bebas_0_0,style_Plan_Bebas_0_1,style_Plan_Bebas_0_2,]
        });
        bounds_group.addLayer(layer_Plan_Bebas_0);
        map.addLayer(layer_Plan_Bebas_0);
        function pop_IUP_1(feature, layer) {
            var popupContent = '<table>\
                    <tr>\
                        <td colspan="2">' + (feature.properties['L'] !== null ? autolinker.link(String(feature.properties['L']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <th scope="row">No_SK</th>\
                        <td>' + (feature.properties['No_SK'] !== null ? autolinker.link(String(feature.properties['No_SK']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                </table>';
            var content = removeEmptyRowsFromPopupContent(popupContent, feature);
			layer.on('popupopen', function(e) {
				addClassToPopupIfMedia(content, e.popup);
			});
			layer.bindPopup(content, { maxHeight: 400 });
        }

        function style_IUP_1_0() {
            return {
                pane: 'pane_IUP_1',
                opacity: 1,
                color: 'rgba(228,26,28,1.0)',
                dashArray: '',
                lineCap: 'square',
                lineJoin: 'bevel',
                weight: 4.0,
                fillOpacity: 0,
                interactive: true,
            }
        }
        map.createPane('pane_IUP_1');
        map.getPane('pane_IUP_1').style.zIndex = 401;
        map.getPane('pane_IUP_1').style['mix-blend-mode'] = 'normal';
        var layer_IUP_1 = new L.geoJson(json_IUP_1, {
            attribution: '',
            interactive: true,
            dataVar: 'json_IUP_1',
            layerName: 'layer_IUP_1',
            pane: 'pane_IUP_1',
            onEachFeature: pop_IUP_1,
            style: style_IUP_1_0,
        });
        bounds_group.addLayer(layer_IUP_1);
        map.addLayer(layer_IUP_1);
        setBounds();
        var i = 0;
        layer_Plan_Bebas_0.eachLayer(function(layer) {
            var context = {
                feature: layer.feature,
                variables: {}
            };
            layer.bindTooltip((layer.feature.properties['Pemilik'] !== null?String('<div style="color: #323232; font-size: 10pt; font-family: \'Open Sans\', sans-serif;">' + layer.feature.properties['Pemilik']) + '</div>':''), {permanent: true, offset: [-0, -16], className: 'css_Plan_Bebas_0'});
            labels.push(layer);
            totalMarkers += 1;
              layer.added = true;
              addLabel(layer, i);
              i++;
        });
        var i = 0;
        layer_IUP_1.eachLayer(function(layer) {
            var context = {
                feature: layer.feature,
                variables: {}
            };
            layer.bindTooltip((exp_label_IUP_1_eval_expression(context) !== null?String('<div style="color: #323232; font-size: 10pt; font-family: \'Open Sans\', sans-serif;">' + exp_label_IUP_1_eval_expression(context)) + '</div>':''), {permanent: true, offset: [-0, -16], className: 'css_IUP_1'});
            labels.push(layer);
            totalMarkers += 1;
              layer.added = true;
              addLabel(layer, i);
              i++;
        });
        resetLabels([layer_Plan_Bebas_0,layer_IUP_1]);
        map.on("zoomend", function(){
            resetLabels([layer_Plan_Bebas_0,layer_IUP_1]);
        });
        map.on("layeradd", function(){
            resetLabels([layer_Plan_Bebas_0,layer_IUP_1]);
        });
        map.on("layerremove", function(){
            resetLabels([layer_Plan_Bebas_0,layer_IUP_1]);
        });
        </script>        
    </body>
</html>
